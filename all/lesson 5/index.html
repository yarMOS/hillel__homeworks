<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GREENSHOP</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="modern-normalize.min.css">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <section class="header">
        <p class="login">Login</p>
        <p>|</p>
        <h1>Register</h1> 
    </section>
    <section class="ep__register">
        <p class="ep__register__ent">Enter your email and password to register.</p>
        <p class="ep__register__name">Username</p>
        <p class="ep__register__mail">Enter your email address</p>
        <section class="pass__img">
            <p class="pass__img__pass">Password</p>
            <img class="pass__img__hide" src="./img/Hide.svg" alt="Hide">
        </section>
        <p class="ep__register__pass">Confirm Password</p>
        <button class="ep__register__btn">Register</button>
        <p class="ep__register_reg">Or register with</p>
        <section class="google">
            <img class="google__img"src="./img/google__1.svg" alt="Google">
            <p class="google__con">Continue with Google</p>
        </section>
        <section class="facebook">
            <img class="facebook__img" src="./img/facebook__1.svg" alt="Facebook">
            <p class="facebook__con">Continue with Facebook</p>
        </section>
    </section>
</body>
</html>
